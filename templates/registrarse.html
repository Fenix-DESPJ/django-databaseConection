{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | M&A Barber Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/registrarse.css' %}">
    <link rel="icon" type="image/jpeg" href="{% static 'img/logo.jpeg' %}">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="registro-container">
        <div class="registro-card">

            <img src="{% static 'img/logo.jpeg' %}" alt="Logo M&A Barber Shop" class="logo-registro">

            <h1>Registrarse</h1>

            <p class="subtitulo">
                Crea tu cuenta para agendar y gestionar tus citas.
            </p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'danger' }}{% endif %}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            <form id="registro-form" method="POST" action="{% url 'registrarse' %}">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre"
                               placeholder="Ingresa tu nombre"
                               data-solo="letras"
                               pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s]+"
                               title="Solo se permiten letras y espacios"
                               maxlength="50"
                               required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido" name="apellido"
                               placeholder="Ingresa tu apellido"
                               data-solo="letras"
                               pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s]+"
                               title="Solo se permiten letras y espacios"
                               maxlength="50"
                               required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control" id="fecha" name="fecha" required>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" name="telefono"
                           placeholder="Ingresa tu número de teléfono"
                           data-solo="numeros"
                           inputmode="numeric"
                           pattern="[0-9]{7,10}"
                           title="Solo números, entre 7 y 10 dígitos"
                           maxlength="10"
                           required>
                </div>

                <div class="mb-3">
                    <label for="cedula" class="form-label">Cédula</label>
                    <input type="text" class="form-control" id="cedula" name="cedula"
                           placeholder="Ingresa tu numero de cedula"
                           data-solo="numeros"
                           inputmode="numeric"
                           pattern="[0-9]{6,10}"
                           title="Solo números, entre 6 y 10 dígitos"
                           maxlength="10"
                           required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Crea una contraseña" minlength="8" required>
                </div>

                <div class="mb-4">
                    <label for="confirmar-password" class="form-label">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="confirmar-password" name="confirmar_password" placeholder="Confirma tu contraseña" minlength="8" required>
                </div>

                <button type="submit" class="btn-registro">
                    Registrarse
                </button>
            </form>

            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1 text-white-50">
                <span class="px-2 small text-white-50">o</span>
                <hr class="flex-grow-1 text-white-50">
            </div>

            <div id="google-signup-container" class="d-flex justify-content-center"></div>

            <div class="mt-3 text-center">
                <a href="{% url 'home' %}" class="volver">← Volver a inicio</a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
    <script>
    function handleGoogleCredentialResponse(response) {
        const csrfToken = document.querySelector('#registro-form input[name=csrfmiddlewaretoken]').value;

        fetch("{% url 'google_login' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": csrfToken
            },
            body: "credential=" + encodeURIComponent(response.credential) + "&rol=cliente"
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                if (data.aviso_password) {
                    alert(data.aviso_password);
                }
                window.location.href = data.redirect;
            } else {
                alert(data.error || "No se pudo registrar con Google.");
            }
        })
        .catch(() => alert("Ocurrió un problema al conectar con Google. Intenta de nuevo."));
    }

    window.onload = function () {
        google.accounts.id.initialize({
            client_id: "{{ GOOGLE_CLIENT_ID }}",
            callback: handleGoogleCredentialResponse
        });
        google.accounts.id.renderButton(
            document.getElementById("google-signup-container"),
            { theme: "outline", size: "large", text: "signup_with", shape: "pill" }
        );
    };
    </script>
</body>
</html>
